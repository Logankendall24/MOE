  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

0.14)\">+<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ qShowInlineNext }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;gap:12px;flex-wrap:wrap;margin-top:16px\">\n            <button sc-camel-on-click=\"{{ qOnInlineNext }}\" style=\"background:#fff;border:1px solid #fff;color:#2C112D;padding:15px 24px;font:500 11px/1 'IBM Plex Mono',monospace;letter-spacing:0.14em;text-transform:uppercase\" style-hover=\"background:#F1D9E6;border-color:#F1D9E6\">Next step ↓<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ qIsCounters }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:12px;margin-top:clamp(22px,3vw,34px);max-width:1000px\">\n            <sc-for list=\"{{ qCounters }}\" as=\"c\" hint-placeholder-count=\"5\">\n              <div style=\"{{ c.rowStyle }}\">\n                <div style=\"display:flex;flex-direction:column;gap:5px;min-width:0\">\n                  <span style=\"font-size:17px;font-weight:500;line-height:1.2\">{{ c.label }}<\u002Fspan>\n                  <span style=\"{{ c.noteStyle }}\">{{ c.note }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:flex;align-items:stretch;flex:none;border:1px solid rgba(255,255,255,0.4)\">\n                  <button sc-camel-on-click=\"{{ c.onMinus }}\" style=\"width:40px;background:transparent;border:none;color:inherit;font-size:19px;line-height:1\" style-hover=\"background:rgba(255,255,255,0.14)\">−<\u002Fbutton>\n                  <span style=\"display:flex;align-items:center;justify-content:center;width:44px;font:500 18px/1 'IBM Plex Mono',monospace;border-left:1px solid rgba(255,255,255,0.28);border-right:1px solid rgba(255,255,255,0.28)\">{{ c.count }}<\u002Fspan>\n                  <button sc-camel-on-click=\"{{ c.onPlus }}\" style=\"width:40px;background:transparent;border:none;color:inherit;font-size:19px;line-height:1\" style-hover=\"background:rgba(255,255,255,0.14)\">+<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"margin-top:18px;font:500 11px/1.5 'IBM Plex Mono',monospace;letter-spacing:0.12em;text-transform:uppercase;color:rgba(255,255,255,0.7)\">{{ qAllocated }}<\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ qIsText }}\" hint-placeholder-val=\"{{ false }}\">\n          <input type=\"text\" value=\"{{ qText }}\" sc-camel-on-change=\"{{ qOnText }}\" placeholder=\"School name, town or address\" style=\"margin-top:clamp(20px,2.6vw,30px);width:100%;max-width:620px;background:transparent;border:none;border-bottom:1px solid rgba(255,255,255,0.5);color:#fff;font-family:'Figtree','Instrument Sans',Helvetica,Arial,sans-serif;font-size:clamp(20px,2.2vw,28px);font-weight:500;padding:12px 2px\">\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ qHasOptions }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:12px;margin-top:clamp(24px,3vw,38px);max-width:1000px\">\n            <sc-for list=\"{{ qOptions }}\" as=\"o\" hint-placeholder-count=\"4\">\n              <button sc-camel-on-click=\"{{ o.onClick }}\" style=\"{{ o.style }}\">\n                <span style=\"font-size:clamp(16px,1.6vw,19px);font-weight:500;line-height:1.22\">{{ o.label }}<\u002Fspan>\n                <span style=\"{{ o.noteStyle }}\">{{ o.note }}<\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;border-top:1px solid rgba(255,255,255,0.22);padding-top:20px\">\n        <img src=\"8340578b-d008-4349-ae99-b57ecb26ed05\" alt=\"New Zealand Government\" style=\"width:clamp(13 ight;font:400 14px/1.22 Helvetica,Arial,sans-serif;white-space:nowrap\">\n                <span>{{ s.reo }}<\u002Fspan>\n                <span>{{ s.label }}<\u002Fspan>\n              <\u002Fspan>\n              <span style=\"{{ s.chevStyle }}\"><\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ isReq }}\" hint-placeholder-val=\"{{ true }}\">\n        <div data-screen-label=\"School requirements\" style=\"flex:1;position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);align-items:start\">\n          <div style=\"border-right:1px solid #D7DAD7;background:#EAEDEA;min-height:100%;padding:26px 0\">\n            <div style=\"padding:0 22px 18px;font:500 10px/1 'IBM Plex Mono',monospace;letter-spacing:0.16em;text-transform:uppercase;color:#8A8189\">Requirements<\u002Fdiv>\n            <sc-for list=\"{{ sections }}\" as=\"s\" hint-placeholder-count=\"7\">\n              <button sc-camel-on-click=\"{{ s.onClick }}\" style=\"{{ s.style }}\">\n                <span style=\"font:500 10px/1 'IBM Plex Mono',monospace;letter-spacing:0.1em;opacity:0.6\">{{ s.n }}<\u002Fspan>\n                <span style=\"font-size:14px\">{{ s.title }}<\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n            <div style=\"margin:22px;padding-top:18px;border-top:1px solid #D7DAD7;font-size:12px;line-height:1.5;color:#7E7480\">Not every field applies to every school. Anything left blank is treated as not in scope.<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"padding:clamp(26px,4vw,52px) clamp(22px,4vw,56px);max-width:860px\">\n            <div style=\"font:500 10px/1 'IBM Plex Mono',monospace;letter-spacing:0.16em;text-transform:uppercase;color:#8A8189\">Section {{ sectionNo }} of 7<\u002Fdiv>\n            <h2 style=\"margin:14px 0 8px;font-size:clamp(26px,3vw,36px);font-weight:500;letter-spacing:-0.02em\">{{ sectionTitle }}<\u002Fh2>\n            <p style=\"margin:0;font-size:16px;line-height:1.45;color:#5D5360;max-width:46em\">{{ sectionIntro }}<\u002Fp>\n\n            <div style=\"margin-top:34px;border-top:1px solid #2C112D\">\n              <sc-for list=\"{{ fields }}\" as=\"f\" hint-placeholder-count=\"4\">\n                <div style=\"display:grid;grid-template-columns:minmax(0,1fr);gap:12px;padding:20px 0;border-bottom:1px solid #D7DAD7\">\n                  <div style=\"display:flex;justify-content:space-between;gap:20px;align-items:baseline;flex-wrap:wrap\">\n                    <div style=\"font-size:16px;font-weight:500\">{{ f.label }}<\u002Fdiv>\n                    <div style=\"font:400 11px/1.4 'IBM Plex Mono',monospace;letter-spacing:0.04em;color:#8A8189;text-align:right\">{{ f.hint }}<\u002Fdiv>\n                  <\u002Fdiv>\n\n                  <sc-if value=\"{{ f.isNumber }}\" hint-placeholder-val=\"{{ true }}\">\n                    <div style=\"display:flex;align-items:stretch;gap:0;width:fit-content;border:1px solid #2C112D;background:#fff\">\n                      <button sc-camel-on-click=\"{{ f.onMinus }}\" style=\"width:42px;border:none;border-right:1px solid #D7DAD7;background:transparent;font-size:18px;line-height:1\" style-hover=\"background:#F1F3F2\">−<\u002Fbutton>\n                      <input type=\"number\" value=\"{{ f.value }}\" sc-camel-on-change=\"{{ f.onChange }}\" style=\"width:86px;border:none;text-align:center;font:500 17px/1 'IBM Plex Mono',monospace;padding:12px 4px;background:transparent;color:#2C112D\">\n                      <span style=\"display:flex;align-items:center;padding-right:12px;font:400 11px/1 'IBM Plex Mono',monospace;color:#8A8189;text-transform:uppercase;letter-spacing:0.08em\">{{ f.unit }}<\u002Fspan>\n                      <button sc-camel-on-click=\"{{ f.onPlus }}\" style=\"width:42px;border:none;border-left:1px solid #D7DAD7;background:transparent;font-size:18px;line-height:1\" style-hover=\"background:#F1F3F2\">+<\u002Fbutton>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n\n                  <sc-if value=\"{{ f.isChoice }}\" hint-placeholder-val=\"{{ true }}\">\n                    <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n                      <sc-for list=\"{{ f.options }}\" as=\"o\" hint-placeholder-count=\"3\">\n                        <button sc-camel-on-click=\"{{ o.onClick }}\" style=\"{{ o.style }}\">{{ o.label }}<\u002Fbutton>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n\n                  <sc-if value=\"{{ f.isText }}\" hint-placeholder-val=\"{{ true }}\">\n                    <input type=\"text\" value=\"{{ f.value }}\" sc-camel-on-change=\"{{ f.onChange }}\" placeholder=\"{{ f.placeholder }}\" style=\"width:100%;max-width:420px;border:1px solid #2C112D;background:#fff;padding:13px 14px;font-size:15px;color:#2C112D\">\n                  <\u002Fsc-if>\n\n                  <sc-if value=\"{{ f.isTextarea }}\" hint-placeholder-val=\"{{ true }}\">\n                    <textarea value=\"{{ f.value }}\" sc-camel-on-change=\"{{ f.onChange }}\" placeholder=\"{{ f.placeholder }}\" rows=\"4\" style=\"width:100%;border:1px solid #2C112D;background:#fff;padding:13px 14px;font-size:15px;line-height:1.5;color:#2C112D;resize:vertical\"><\u002Ftextarea>\n                  <\u002Fsc-if>\n\n                  <sc-if value=\"{{ f.note }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"display:flex;gap:10px;background:#EAEDEA;border-left:2px solid #2C112D;padding:12px 14px;font-size:13px;line-height:1.5;color:#5D5360;max-width:52em\">{{ f.note }}<\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <div style=\"display:flex;gap:12px;flex-wrap:wrap;margin-top:32px\">\n              <button sc-camel-on-click=\"{{ onPrevSection }}\" style=\"background:transparent;border:1px solid #2C112D;color:#2C112D;paddi      <\u002Fdiv>\n\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:24px;align-items:start\">\n              <sc-for list=\"{{ reviewGroups }}\" as=\"g\" hint-placeholder-count=\"4\">\n                <div style=\"background:#fff;border:1px solid #D7DAD7\">\n                  <div style=\"display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid #D7DAD7;background:#EAEDEA\">\n                    <div style=\"font:500 11px/1 'IBM Plex Mono',monospace;letter-spacing:0.12em;text-transform:uppercase\">{{ g.title }}<\u002Fdiv>\n                    <button sc-camel-on-click=\"{{ g.onEdit }}\" style=\"background:transparent;border:1px solid #B6B0B4;color:#2C112D;padding:6px 10px;font:500 10px/1 'IBM Plex Mono',monospace;letter-spacing:0.1em;text-transform:uppercase\" style-hover=\"border-color:#2C112D\">Edit<\u002Fbutton>\n                  <\u002Fdiv>\n                  <div style=\"padding:6px 18px 14px\">\n                    <sc-for list=\"{{ g.rows }}\" as=\"r\" hint-placeholder-count=\"3\">\n                      <div style=\"display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid #EDEFEC;font-size:14px\">\n                        <span style=\"color:#5D5360\">{{ r.label }}<\u002Fspan>\n                        <span style=\"font:500 14px/1.3 'IBM Plex Mono',monospace;text-align:right\">{{ r.value }}<\u002Fspan>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n\n              <div style=\"background:#2C112D;color:#fff;border:1px solid #2C112D\">\n                <div style=\"padding:14px 18px;border-bottom:1px solid rgba(255,255,255,0.22);font:500 11px/1 'IBM Plex Mono',monospace;letter-spacing:0.12em;text-transform:uppercase\">Requirement calculation<\u002Fdiv>\n                <div style=\"padding:6px 18px -width:1320px;margin:0 auto\">\n            <div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap\">\n              <div style=\"min-width:0\">\n                <div style=\"font:500 10px/1 'IBM Plex Mono',monospace;letter-spacing:0.16em;text-transform:uppercase;color:#8A8189\">Step 03<\u002Fdiv>\n                <h2 style=\"margin:14px 0 8px;font-size:clamp(26px,3vw,36px);font-weight:500;letter-spacing:-0.02em\">{{ optionCount }} standard design options<\u002Fh2>\n                <p style=\"margin:0;font-size:16px;line-height:1.45;color:#5D5360;max-width:44em\">{{ optionsIntro }}<\u002Fp>\n              <\u002Fdiv>\n              <button sc-camel-on-click=\"{{ onCompare }}\" style=\"{{ compareBtnStyle }}\">Compare selected ({{ compareCount }})<\u002Fbutton>\n            <\u002Fdiv>\n\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:22px;margin-top:34px;align-items:start\">\n              <sc-for list=\"{{ optionCards }}\" as=\"o\" hint-placeholder-count=\"3\">\n                <div style=\"{{ o.cardStyle }}\">\n                  <div style=\"display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid #D7DAD7\">\n                    <div style=\"display:flex;align-items:center;gap:12px\">\n                      <span style=\"font:500 13px/1 'IBM Plex Mono',monospace;letter-spacing:0.1em\">OPTION {{ o.id }}<\u002Fspan>\n                      <span style=\"{{ o.tagStyle }}\">{{ o.tag }}<\u002Fspan>\n                    <\u002Fdiv>\n                    <span style=\"{{ o.fitStyle }}\">{{ o.fitText }}<\u002Fspan>\n                  <\u002Fdiv>\n\n                  <div ref=\"{{ cardBoxRef }}\" style=\"position:relative;height:210px;background:#F7F8F6;border-bottom:1px solid #D7DAD7;overflow:hidden\">\n                    <div style=\"position:absolute;inset:0;perspective:2200px\">\n                      <div style=\"{{ o.stageStyle }}\">\n                        <div style=\"{{ o.sceneStyle }}\">\n                          <sc-for list=\"{{ o.faces }}\" as=\"f\" hint-placeholder-count=\"12\">\n                            <div style=\"{{ f.style }}\"><\u002Fdiv>\n                          <\u002Fsc-for>\n                        <\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n\n                  <div style=\"padding:18px\">\n                    <div style=\"font-size:18px;font-weight:500;line-height:1.25\">{{ o.title }}<\u002Fdiv>\n                    <p style=\"margin:8px 0 0;font-size:14px;line-height:1.5;color:#5D5360\">{{ o.summary }}<\u002Fp>\n\n                    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#E4E6E3;margin-top:18px;border:1px solid #E4E6E3\">\n                      <sc-for list=\"{{ o.stats }}\" as=\"s\" hint-placeholder-count=\"4\">\n                        <div style=\"background:#fff;padding:11px 12px\">\n                          <div style=\"font:400 9.5px/1 'IBM Plex Mono',monospace;letter-spacing:0.1em;text-transform:uppercase;color:#8A8189\">{{ s.label }}<\u002Fdiv>\n                          <div style=\"margin-top:6px;font:500 16px/1 'IBM Plex Mono',monospace\">{{ s.value }}<\u002Fdiv>\n                        <\u002Fdiv>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n\n                    <div style=\"display:flex;gap:8px;margin-top:20px;flex-wrap:wrap\">\n                      <button sc-camel-on-click=\"{{ o.onView }}\" style=\"flex:1;min-width:150px;background:#2C112D;border:1px solid #2C112D;color:#fff;padding:14px 16px;font:500 11px/1 'IBM Plex Mono',monospace;letter-spacing:0.12em;text-transform:uppercase\" style-hover=\"background:#46203F\">View building →<\u002Fbutton>\n                      <button sc-camel-on-click=\"{{ o.onToggleCompare }}\" style=\"{{ o.compareStyle }}\">{{ o.compareLabel }}<\u002Fbutton>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <sc-if value=\"{{ noOptions }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"margin-top:30px;background:#fff;border:1px solid #D7DAD7;padding:26px;max-width:46em\">\n                <div style=\"font-size:18px;font-weight:500\">No new standard buildings required<\u002Fdiv>\n                <p style=\"margin:10px 0 0;font-size:15px;line-height:1.5;color:#5D5360\">The existing teaching spaces retained already meet the calculated entitlement, and no library or administration work is in scope. Adjust the roll, retained spaces or scope to see options.<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isBuilding }}\" hint-placeholder-val=\"{{ true }}\">\n        <div data-screen-label=\"Building view\" style=\"flex:1;position:relative;z-index:1;padding:clamp(24px,3.4vw,44px) clamp(22px,4vw,56px) clamp(36px,4vw,60px)\">\n          <div style=\"max-width:1320px;margin:0 auto\">\n            <div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap\">\n              <div style=\"min-width:0\">\n                <div style=\"font:500 10px/1 'IBM Plex Mono',monospace;letter-spacing:0.16em;text-transform:uppercase;color:#8A8189\">Step 04 · {{ optLabel }}<\u002Fdiv>\n                <h2 style=\"margin:12px 0 0;font-family:'Figtree','Instrument Sans',Helvetica,Arial,sans-serif;font-size:clamp(30px,3.6vw,50px);font-weight:800;line-height:1.04;letter-spacing:-0.028em;text-wrap:pretty\">{{ infoBlockName }}<\u002Fh2>\n                <div style=\"margin-top:10px;font:400 12.5px/1.5 'IBM Plex Mono',monospace;color:#7E7480\">{{ infoBlockMeta }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:6px;flex-wrap:wrap\">\n                <s 0.65)\">Selected module<\u002Fdiv>\n                      <button sc-camel-on-click=\"{{ onClearSelection }}\" style=\"background:transparent;border:1px solid rgba(255,255,255,0.4);color:#fff;padding:5px 9px;font:500 9.5px/1 'IBM Plex Mono',monospace;letter-spacing:0.1em;text-transform:uppercase\">Clear<\u002Fbutton>\n                    <\u002Fdiv>\n                    <div style=\"margin-top:10px;font-size:17px;font-weight:500;line-height:1.25\">{{ selectionName }}<\u002Fdiv>\n                    <div style=\"margin-top:8px;font-size:13px;line-height:1.5;color:rgba(255,255,255,0.75)\">{{ selectionNote }}<\u002Fdiv>\n                    <div style=\"margin-top:10px\">\n                      <sc-for list=\"{{ selectionRows }}\" as=\"r\" hint-placeholder-count=\"3\">\n                        <div style=\"display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.16);font-size:13px\">\n                          <span style=\"color:rgba(255,255,255,0.7)\">{{ r.label }}<\u002Fspan>\n                          <span style=\"font:500 13px/1.3 'IBM Plex Mono',monospace\">{{ r.value }}<\u002Fspan>\n                        <\u002Fdiv>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                    <button sc-camel-on-click=\"{{ onToggleIsolate }}\" style=\"{{ isolateStyle }}\">{{ isolateLabel }}<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n\n                <button sc-camel-on-click=\"{{ onCustomise }}\" style=\"margin-top:auto;width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fff;border:1px solid #fff;color:#2C112D;padding:18px 20px;font:500 12px/1 'IBM Plex Mono',monospace;letter-spacing:0.14em;text-transform:uppercase;cursor:pointer\" style-hover=\"background:#F1D9E6;border-color:#F1D9E6\"><span>Customise building<\u002Fspan><span>→<\u002Fspan><\u002Fbutton>\n                <div style=\"display:flex;gap:8px;flex-wrap:wra  }}<\u002Fspan>\n                            <\u002Fdiv>\n                          <\u002Fsc-for>\n                        <\u002Fdiv>\n                      <\u002Fsc-if>\n                      <sc-if value=\"{{ sct.hasDocs }}\" hint-placeholder-val=\"{{ false }}\">\n                        <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:18px 14px\">\n                          <sc-for list=\"{{ sct.docs }}\" as=\"dc\" hint-placeholder-count=\"4\">\n                            <a href=\"{{ dc.href }}\" target=\"_blank\" rel=\"noopener\" sc-camel-on-click=\"{{ dc.onClick }}\" style=\"display:flex;flex-direction:column;gap:10px;text-decoration:none;color:#2C112D;min-width:0\">\n                              <div style=\"{{ dc.boxStyle }}\">\n                                \n                                <sc-if value=\"{{ dc.noThumb }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"font:500 11px/1 'IBM Plex Mono',monospace;letter-spacing:0.14em;color:#A79FA5\">PDF<\u002Fspan><\u002Fsc-if>\n                              <\u002Fdiv>\n                              <div style=\"display:flex;flex-direction:column;gap:4px\">\n                                <span style=\"font-size:14px;font-weight:500;line-height:1.3\">{{ dc.title }}<\u002Fspan>\n                                <span style=\"font:400 10.5px/1.3 'IBM Plex Mono',monospace;letter-spacing:0.04em;color:#8A8189\">{{ dc.status }}<\u002Fspan>\n                              <\u002Fdiv>\n                            <\u002Fa>\n                          <\u002Fsc-for>\n                        <\u002Fdiv>\n                      <\u002Fsc-if>\n                      <div style=\"font:400 10.5px/1.4 'IBM Plex Mono',monospace;letter-spacing:0.08em;text-transform:uppercase;color:#8A8189\">Source · {{ sct.source }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002F
