# fly.toml app configuration file generated for moe-standard-designs on 2026-09-22T18:05:33+12:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'moe-standard-designs'
primary_region = 'syd'
console_command = '/rails/bin/rails console'

[build]

[env]
  HTTP_PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
