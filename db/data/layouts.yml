# Specific typology/layout variants nested under an umbrella BuildingType (building_types.yml).
# key: internal lookup key, used to attach spaces below — not persisted as a column.
# building_type_code: links to building_types.yml's `code`.
# space_keys: optional array of spaces.yml keys this layout is built from.

# --- Type S variants (both primary/intermediate and secondary catalogues) ---
- key: layout_s1
  building_type_code: S
  name: "S1 — Single-depth, single-storey"
  notes: >
    2–6 teaching spaces. [MOE-PDF] Primary/Intermediate Catalogue p.7; Secondary
    Catalogue p.7. "For many [primary/secondary] schools, a single-storey teaching
    block will be suitable if there is enough space."
  space_keys: []

- key: layout_s2
  building_type_code: S
  name: "S2 — Single-depth, two-storey"
  notes: >
    6–18 teaching spaces (combined figure given for S2/S3 together in the source).
    [MOE-PDF] Primary/Intermediate Catalogue p.7; Secondary Catalogue p.7.
  space_keys: []

- key: layout_s3
  building_type_code: S
  name: "S3 — Single-depth, three-storey"
  notes: >
    6–18 teaching spaces (combined figure given for S2/S3 together in the source;
    shown "dashed" in the typology diagram, i.e. a less common/optional variant).
    [MOE-PDF] Primary/Intermediate Catalogue p.7; Secondary Catalogue p.7.
  space_keys: []

- key: layout_omb25
  building_type_code: S
  name: "OMB 2.5 — Relocatable, single-storey"
  notes: >
    1–4 teaching spaces. [MOE-PDF] Primary/Intermediate Catalogue p.7; Secondary
    Catalogue p.7. "OMB" is not expanded/defined in either source document.
    [NEEDS CONFIRMATION] Exact meaning of "OMB" abbreviation.
  space_keys: []

# --- Type D variants (secondary catalogue only) ---
- key: layout_d1
  building_type_code: D
  name: "D1 — Double-depth, single-storey"
  notes: >
    6–10 teaching spaces. [MOE-PDF] Secondary Catalogue p.7. Not present in the
    Primary/Intermediate Catalogue.
  space_keys: []

- key: layout_d2
  building_type_code: D
  name: "D2 — Double-depth, two-storey"
  notes: >
    12–33 teaching spaces (combined figure given for D2/D3 together in the source).
    [MOE-PDF] Secondary Catalogue p.7.
  space_keys: []

- key: layout_d3
  building_type_code: D
  name: "D3 — Double-depth, three-storey"
  notes: >
    12–33 teaching spaces (combined figure given for D2/D3 together in the source;
    shown "dashed" in the typology diagram). [MOE-PDF] Secondary Catalogue p.7.
  space_keys: []

# --- Type G variants (gyms and halls document) ---
- key: layout_gs_s
  building_type_code: G
  name: "GS-S — Single Court Gymnasium, amenities on short side"
  notes: >
    [MOE-PDF] "Standard designs for school gyms and halls" p.8. "Single and double
    court gyms are designed for school and community level sporting activities...
    can be scaled up or down, depending on the school's site constraints." Not split
    by school type in the source. Layout options (court / seating / alternative
    seating) on p.9.
  space_keys: []

- key: layout_gs_l
  building_type_code: G
  name: "GS-L — Single Court Gymnasium, amenities on long side"
  notes: >
    [MOE-PDF] "Standard designs for school gyms and halls" p.8.
  space_keys: []

- key: layout_gd_s
  building_type_code: G
  name: "GD-S — Double Court Gymnasium, amenities on short side"
  notes: >
    [MOE-PDF] "Standard designs for school gyms and halls" p.8.
  space_keys: []

# --- Type H variants (gyms and halls document) ---
- key: layout_hs_s_p
  building_type_code: H
  name: "HS-S-P — Small Primary School Hall, amenities on short side"
  notes: >
    [MOE-PDF] "Standard designs for school gyms and halls" p.11. "There are a range
    of different hall options depending on the type of school and its particular
    needs... can be scaled up or down depending on school site constraints." No
    numeric roll-band threshold is stated for "Small" vs "Medium" vs "Large" — do
    not infer one.
  space_keys: []

- key: layout_hm_s_p
  building_type_code: H
  name: "HM-S-P — Medium Primary School Hall, amenities on short side"
  notes: "[MOE-PDF] \"Standard designs for school gyms and halls\" p.11."
  space_keys: []

- key: layout_hl_s_p
  building_type_code: H
  name: "HL-S-P — Large Primary School Hall, amenities on short side"
  notes: >
    [MOE-PDF] "Standard designs for school gyms and halls" p.11. A worked "Large Hall
    Primary School" example gives net floor area ~510m² (~19m × 25.6m) — see the
    "Hall — large primary (worked example)" space record. This is the only hall size
    with a stated figure in the source.
  space_keys: [hall_large_primary_example]

- key: layout_hs_l_s
  building_type_code: H
  name: "HS-L-S — Small Secondary School Hall, amenities on long side"
