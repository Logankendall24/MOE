# --- Library layouts (no stated building-type linkage in the source — attached to Type S
#     here as the most likely host building, per the shared modular teaching-space system;
#     this attachment is an editorial convenience, not a Ministry-stated fact). ---
- key: layout_library_100
  building_type_code: S
  name: "Library 100 — Primary (A)"
  notes: >
    Occupancy "<500 Student Roll". ≈86.4m² (7.2m × 12.0m, calculated from grid
    dimensions — no explicit m² figure in the source). Primary-only. [MOE-PDF]
    "Standard layouts for school library spaces" p.7. [NEEDS CONFIRMATION] Whether
    this attaches to a Type S building specifically — not stated in the source.
  space_keys: [library_small]

- key: layout_library_101
  building_type_code: S
  name: "Library 101 — Primary (B) / Secondary (A)"
  notes: >
    Occupancy "500 - 800 Student Roll". ≈172.8m² (14.4m × 12.0m, calculated). Shared
    sheet: the same layout serves as the "B" (larger) option for primary schools and
    the "A" (smaller/entry) option for secondary schools. [MOE-PDF] "Standard layouts
    for school library spaces" p.8.
  space_keys: [library_medium]

- key: layout_library_102
  building_type_code: S
  name: "Library 102 — Secondary (B)"
  notes: >
    Occupancy "800 - 1400 Student Roll". ≈259.2m² (21.6m × 12.0m, calculated).
    Secondary-only; the largest of the three library layouts. [MOE-PDF] "Standard
    layouts for school library spaces" p.10.
  space_keys: [library_large]
