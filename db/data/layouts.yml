# --- Administration layouts (attach to Type S, per the Resource & Admin Module system) ---
- key: layout_admin_primary_a
  building_type_code: S
  name: "Admin 110 — Primary (A)"
  notes: >
    Occupancy "<200 Student Roll". Overall footprint ≈14.4m × 12.0m (calculated from
    grid dimensions, not an explicit m² figure in the source). Rooms: Staffroom &
    Workspace, Resource, Meeting, Reception, Public/Student Waiting, Sickbay
    (+ Accessible WC), Leadership. [MOE-PDF] "Standard layouts for primary school
    administration spaces" p.7.
  space_keys: []

- key: layout_admin_primary_b
  building_type_code: S
  name: "Admin 111 — Primary (B)"
  notes: >
    Occupancy "200 - 500 Student Roll". Overall footprint ≈28.8m × 12.0m (calculated).
    Adds: Reprographics, Finance, larger Meeting rooms, Store/Utility.
    [MOE-PDF] "Standard layouts for primary school administration spaces" p.9.
  space_keys: []

- key: layout_admin_primary_c
