# Every standard layout sheet in the source PDFs, as structured data.
#
#   id          Sheet number as printed on the sheet (unique across all documents).
#   title       Verbatim from the top-left of the sheet.
#   source      Key in sources.yml.
#   pages       PDF page numbers. The first is the general arrangement; any
#               following pages are continuation sheets of the same layout.
#   sheets      Drawing numbers from the title block, one per page.
#   categories  School categories the sheet applies to (from its own title or
#               its document).
#   space       teaching | support | specialist | admin | library | gym | hall
#   variant     Layout letter from the sheet title, where it has one.
#   module      Teaching-module class (categories.yml), matched on grid_mm.
#   grid_mm     Structural grid printed on the sheet [width, depth].
#   occupancy   Verbatim occupancy text from the sheet's Details panel.
#   roll_band   School-roll range the sheet is designed for, parsed from its
#               occupancy text. Only sheets that state a student roll have one.
#
# Nothing here is inferred: where a sheet doesn't state something, the field is
# absent.

