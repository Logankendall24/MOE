# 3D models (SketchUp → GLB) shown in the building page's 3D window.
#
# Keyed by the building type id the design's option engine uses (R, S1, S2,
# S3, L, C). `default` is used for any building without its own entry. The
# 3D window falls back to the design's own massing view while a model loads,
# or if the browser can't show it.
#
# To add a model: export it from SketchUp as GLB, put it in public/models/,
# and add an entry. Example:
#   S1:
#     glb: /models/s1.glb
#     label: "Type S1 — single-depth, single-storey"
#     source: "SketchUp model supplied by <who>, <date>"
#     official: false   # true only for Ministry-issued models

default:
  glb: /models/3d-model-test.glb
  label: Example model (placeholder)
  source: "3d model test, SketchUp export supplied by the project team, 24 Sep 2026"
  official: false
