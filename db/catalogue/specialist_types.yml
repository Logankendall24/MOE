# Specialist teaching spaces the user can choose in the requirements flow,
# per category. Every specialist teaching-space layout in the category's
# layout PDF is listed, named as its sheet title prints it (checked by
# `rails catalogue:verify`).
#
#   sheets:      the space's own layout sheets.
#   supporting:  supporting-room sheets shown with it. Where a sheet states
#                what it serves (e.g. "Serving 1-2 Specialist Labs") that is
#                followed; otherwise the pairing is a judgement, marked below.
#
# Primary / intermediate: the primary layout PDFs contain no specialist-space
# sheets, so there is nothing to list; the requirements flow keeps the
# design's own specialist options and no specialist diagrams are shown.
primary_intermediate: {}

secondary:
  "Digital Technologies / Computer Science / Media Studies":
    sheets: ["030", "031"]
    supporting: ["080", "081"]   # Computer Room (A)/(B), judgement
  "Dance":
    sheets: ["040"]
    supporting: ["082"]          # Changing Room, judgement
  "Drama":
    sheets: ["041"]
    supporting: ["082"]          # Changing Room, judgement
  "Music":
    sheets: ["042"]
    supporting: ["083", "084"]   # Practice Rooms (A)/(B), judgement
  "Science General / Primary Industry":
    sheets: ["050"]
    supporting: ["085", "086"]   # Science Technician, "Serving … Specialist Labs"
  "Science Specialist (Chemistry / Biology / Physics)":
    sheets: ["051"]
    supporting: ["085", "086"]   # Science Technician, "Serving … Specialist Labs"
  "Automotive":
    sheets: ["060"]
    supporting: ["089", "090"]   # Machine & Equipment (A)/(B), judgement
  "Health Education (Food Technology)":
    sheets: ["061"]
    supporting: ["091", "092"]   # Pantry / Equipment / Laundry, "Serving 2-3 Technology Classrooms"
  "Hospitality":
    sheets: ["062"]
    supporting: ["091", "092"]   # Pantry / Equipment / Laundry, "Serving 2-3 Technology Classrooms"
  "Materials & Processing (Hard Materials / Building & Construction)":
    sheets: ["063"]
    supporting: ["089", "090"]   # Machine & Equipment (A)/(B), judgement
  "Materials & Processing (Textiles / Fabrics / Fashion)":
    sheets: ["064"]
    supporting: ["091", "092"]   # Pantry / Equipment / Laundry, "Serving 2-3 Technology Classrooms"
  "Mechatronics / Engineering":
